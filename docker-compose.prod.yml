version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aikino_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - aikino_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aikino_backend
    restart: always
    environment:
      - APP_NAME="AI Kino 2.0"
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=aikino_prod
      - DB_USERNAME=aikino_user
      - DB_PASSWORD=aikino_secure_password_2026
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aikino_net

  postgres:
    image: postgres:16-alpine
    container_name: aikino_postgres
    restart: always
    environment:
      POSTGRES_DB: aikino_prod
      POSTGRES_USER: aikino_user
      POSTGRES_PASSWORD: aikino_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aikino_user -d aikino_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aikino_net

  redis:
    image: redis:7-alpine
    container_name: aikino_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aikino_net

volumes:
  postgres_data:
  redis_data:

networks:
  aikino_net:
    driver: bridge
